services:
  # Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noteshare-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # MongoDB Atlas Cloud Connection String:
      - MONGO_URI=mongodb+srv://amishra_new_ab:S2XUr0sK7Olwvhst@notesharecluster.zs6zkus.mongodb.net/noteshare?retryWrites=true&w=majority&appName=NoteShareCluster
      - JWT_SECRET=your_jwt_secret_key_change_in_production
      # AWS S3 Configuration (Set USE_S3=true when using AWS S3 for cloud storage):
      # - USE_S3=false
      # - AWS_REGION=ap-south-1
      # - AWS_ACCESS_KEY_ID=your_access_key
      # - AWS_SECRET_ACCESS_KEY=your_secret_key
      # - AWS_S3_BUCKET_NAME=noteshare-uploads-bucket
    volumes:
      # Persistent named Docker volume for note uploads directory
      - backend_uploads:/app/uploads
    networks:
      - noteshare-network

  # Node.js Static Frontend Service (No Nginx / Apache / Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noteshare-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - noteshare-network

volumes:
  backend_uploads:
    driver: local

networks:
  noteshare-network:
    driver: bridge
