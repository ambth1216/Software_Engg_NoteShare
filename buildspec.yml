version: 0.2

phases:
  pre_build:
    commands:
      - echo "Preparing Amazon ECR login"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REGISTRY

  build:
    commands:
      - echo "Building backend image"
      - docker build -t $REGISTRY/noteshare-backend:$IMAGE_TAG -t $REGISTRY/noteshare-backend:latest ./backend

      - echo "Building frontend image"
      - docker build -t $REGISTRY/noteshare-frontend:$IMAGE_TAG -t $REGISTRY/noteshare-frontend:latest ./frontend

  post_build:
    commands:
      - echo "Pushing backend images"
      - docker push $REGISTRY/noteshare-backend:$IMAGE_TAG
      - docker push $REGISTRY/noteshare-backend:latest

      - echo "Pushing frontend images"
      - docker push $REGISTRY/noteshare-frontend:$IMAGE_TAG
      - docker push $REGISTRY/noteshare-frontend:latest

      - echo "Images pushed successfully"
      - echo "Image tag is $IMAGE_TAG"